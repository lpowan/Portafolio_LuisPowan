spring.application.name=Portafolio

spring.messages.basename=messages

spring.messages.encoding=UTF-8

server.port=80

logging.pattern.dateformat=hh:mm

spring.main.banner-mode=off

spring.thymeleaf.cache=false

#Conexion local a la BD Techshop en MySQL (MySQL80 de esta PC)
spring.datasource.url=jdbc:mysql://localhost:3306/techshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica&characterEncoding=UTF-8


#Usuario de creaTablas.sql (techshop.sql)
spring.datasource.username=usuario_prueba
#La clave NO va en este archivo (el repositorio es publico):
#se lee de secrets.properties (ignorado por Git)
spring.config.import=optional:file:./secrets.properties

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar informacion en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#Carpeta local donde se guardan las imagenes subidas.
#Se publican en la URL /imagenes/**
app.uploads.dir=./uploads

#Tamano maximo de las imagenes que se suben
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


