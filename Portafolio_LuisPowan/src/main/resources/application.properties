spring.application.name=Portafolio

spring.messages.basename=messages

spring.messages.encoding=UTF-8

server.port=80

logging.pattern.dateformat=hh:mm

spring.main.banner-mode=off

spring.thymeleaf.cache=false

#Conexion local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://techshop-ltgpowan-b827.d.aivencloud.com:24384/techshop?sslMode=REQUIRED


#Usuario y clave de creaTablas.sql
spring.datasource.username=avnadmin
#La clave NO va en este archivo (el repositorio es publico):
#- En tu PC se lee de secrets.properties (ignorado por Git)
#- En Render se lee de la variable de entorno SPRING_DATASOURCE_PASSWORD
spring.config.import=optional:file:./secrets.properties

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar informacion en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-d8163.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-d8163-firebase-adminsdk-fbsvc-44b6d96d02.json


